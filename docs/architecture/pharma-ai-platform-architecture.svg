<g fill="#cbd7e6" font-size="14">
<text x="68" y="376">• BM25 lexical retrieval</text><text x="68" y="406">• SentenceTransformer dense retrieval</text><text x="68" y="436">• PostgreSQL / pgvector</text><text x="68" y="466">• HNSW / IVFFlat indexing</text><text x="68" y="496">• query rewrite + metadata + rerank</text>
